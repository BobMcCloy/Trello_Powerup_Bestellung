<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <title>Katalog verwalten</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <link rel="stylesheet" href="./hell.css?v=4">
  <link rel="stylesheet" href="./dunkel.css?v=4">
  <style>
    .katalog-liste {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 320px;
      overflow-y: auto;
    }

    .katalog-liste li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
    }

    .katalog-liste li:last-child {
      border-bottom: none;
    }

    .katalog-liste li:hover {
      background: var(--bg-hover);
    }

    .neue-zeile {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .neue-zeile input[type="text"] {
      flex-grow: 2;
    }

    .neue-zeile input[type="number"] {
      width: 80px;
    }

    .neue-zeile select {
      width: 130px;
    }

    .hinweis {
      color: var(--text-light);
      margin-bottom: 10px;
    }

    .katalog-info {
      color: var(--text-light);
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .katalog-name-container {
      display: flex;
      flex-direction: column;
    }
  </style>
</head>

<body class="auswertung">

  <p class="hinweis">
    Diese Liste erscheint als Vorschlag beim Eintragen von Haupt- und Unterartikeln
    auf den Karten. Änderungen gelten sofort für das ganze Board.
  </p>

  <div class="neue-zeile">
    <input type="text" id="neuer-eintrag" placeholder="Neuer Artikel...">
    <input type="number" id="neuer-preis" placeholder="Preis (€)" step="0.01">
    <select id="neuer-lieferant">
      <option value="">- Lade Lieferanten -</option>
    </select>
    <button id="hinzufuegen">Hinzufügen</button>
  </div>

  <div class="tabellen-rahmen">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Std. Lieferant</th>
          <th class="zahl">Std. Preis</th>
          <th style="width: 120px;"></th>
        </tr>
      </thead>
      <tbody id="liste"></tbody>
    </table>
  </div>

  <script src="./config.js"></script>
  <script src="./utils.js"></script>
  <script src="./katalog.js"></script>
</body>

</html>
