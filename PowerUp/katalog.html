<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Katalog verwalten</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <link rel="stylesheet" href="./hell.css">
  <link rel="stylesheet" href="./dunkel.css">
  <style>
    .katalog-liste {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 320px;
      overflow-y: auto;
    }
    .katalog-liste li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .katalog-liste li:last-child { border-bottom: none; }
    .katalog-liste li:hover { background: var(--bg-hover); }
    .neue-zeile {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }
    .neue-zeile input { flex-grow: 1; }
    .hinweis { color: var(--text-light); font-size: 13px; margin-bottom: 10px; }
  </style>
</head>
<body class="auswertung">

  <p class="hinweis">
    Diese Liste erscheint als Vorschlag beim Eintragen von Haupt- und Unterartikeln
    auf den Karten. Änderungen gelten sofort für das ganze Board.
  </p>

  <div class="neue-zeile">
    <input type="text" id="neuer-eintrag" placeholder="Neuer Katalog-Eintrag...">
    <button id="hinzufuegen">Hinzufügen</button>
  </div>

  <div class="tabellen-rahmen">
    <ul class="katalog-liste" id="liste"></ul>
  </div>

  <script src="./katalog.js"></script>
</body>
</html>
