<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <title>Katalog verwalten</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <link rel="stylesheet" href="./hell.css?v=4">
  <link rel="stylesheet" href="./dunkel.css?v=4">
  <style>
    .katalog-liste {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 320px;
      overflow-y: auto;
    }

    .katalog-liste li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
    }

    .katalog-liste li:last-child {
      border-bottom: none;
    }

    .katalog-liste li:hover {
      background: var(--bg-hover);
    }



    .hinweis {
      color: var(--text-light);
      margin-bottom: 10px;
    }

    .katalog-info {
      color: var(--text-light);
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .katalog-name-container {
      display: flex;
      flex-direction: column;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 5px;
    }

    .tab-btn {
      background: none;
      border: none;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: bold;
      color: var(--text-light);
      border-radius: var(--radius);
    }

    .tab-btn:hover {
      background: var(--bg-hover);
    }

    .tab-btn.active {
      color: var(--trello-blue);
      background: var(--bg-subtle);
    }
  </style>
</head>

<body class="auswertung">

  <p class="hinweis">
    Diese Liste erscheint als Vorschlag beim Eintragen von Haupt- und Unterartikeln
    auf den Karten. Änderungen gelten sofort für das ganze Board.
  </p>

  <div class="tabs">
    <button class="tab-btn active" id="tab-produkte">Produkte (Hauptartikel)</button>
    <button class="tab-btn" id="tab-material">Materialien (Unterartikel)</button>
  </div>

  <div style="margin-bottom: 15px;">
    <button id="btn-neu-zeile" class="btn-hinzufuegen" style="width: 100%;">+ Hinzufügen</button>
  </div>

  <div class="tabellen-rahmen">
    <table>
      <thead>
        <tr>
          <th id="th-fav" style="width: 40px; text-align: center;" title="Schnell-Button">★</th>
          <th>Name</th>
          <th id="th-lief">Std. Lieferant</th>
          <th class="zahl">Std. Preis</th>
          <th style="width: 120px;"></th>
        </tr>
      </thead>
      <tbody id="liste"></tbody>
    </table>
  </div>

  <script src="./config.js"></script>
  <script src="./utils.js"></script>
  <script src="./katalog.js"></script>
</body>

</html>
