<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Produkte</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>

  <link rel="stylesheet" href="./hell.css">
  <link rel="stylesheet" href="./dunkel.css">

  <style>
    .expand-btn {
      background: none; border: none; color: var(--trello-blue); font-size: 16px;
      font-weight: bold; cursor: pointer; width: 24px; height: 24px; border-radius: 4px;
    }
    .expand-btn:hover { background: var(--border); }
    .sub-container {
      background: var(--bg-hover); padding: 12px; border-radius: var(--radius);
      margin: 4px 0 12px 0; border: 1px solid var(--border);
    }
    .sub-table { margin-bottom: 12px; background: var(--bg-main); }
    .sub-table th, .sub-table td { font-size: 13px; padding: 6px 8px; }

    .radio-group { display: flex; gap: 10px; font-size: 13px; align-items: center; flex-wrap: wrap; }
    .radio-label { display: flex; align-items: center; gap: 4px; cursor: pointer; color: var(--text-dark); }
    .radio-label input[type="radio"] { accent-color: var(--trello-blue); cursor: pointer; margin: 0; }

    .overlay-bg {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(9, 30, 66, 0.6); z-index: 100; align-items: center; justify-content: center; padding: 15px;
    }
    [data-theme="dark"] .overlay-bg { background: rgba(9, 30, 66, 0.85); }

    .overlay-box {
      background: var(--bg-main); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; width: 100%; max-width: 450px; box-shadow: 0 8px 16px -4px rgba(0,0,0,0.3);
      display: flex; flex-direction: column; gap: 12px;
    }
    .overlay-header {
      display: flex; justify-content: space-between; align-items: center;
      font-weight: bold; font-size: 14px; color: var(--text-dark);
      border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 4px;
    }
    .close-btn {
      background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-light); padding: 0; line-height: 1;
    }
    .close-btn:hover { color: var(--text-dark); }
    .top-bar { display: flex; justify-content: space-between; margin-bottom: 15px; align-items: center; }
    .loeschen { cursor: pointer; color: var(--text-light); font-weight: bold; }
    .loeschen:hover { color: #B04632; }
  </style>
</head>
<body class="karte">

  <div class="top-bar">
    <button class="btn-hinzufuegen" onclick="openHauptOverlay()">+ Artikel hinzufügen</button>
  </div>

  <div id="inhalt"></div>
  <datalist id="katalog-liste"></datalist>

  <!-- OVERLAY: Hauptartikel -->
  <div id="overlay-haupt" class="overlay-bg">
    <div class="overlay-box">
      <div class="overlay-header">
        Neuer Hauptartikel
        <button class="close-btn" onclick="closeOverlays()">✕</button>
      </div>
      <div style="display: flex; gap: 10px;">
        <div class="input-group" style="width: 80px;">
          <label for="stk">Stk</label>
          <input id="stk" type="number" min="1" value="1">
        </div>
        <div class="input-group" style="flex-grow: 1;">
          <label for="artikel">Artikelname</label>
          <input id="artikel" type="text" list="katalog-liste" placeholder="z. B. Rosen rot">
        </div>
      </div>
      <div class="input-group">
        <label for="preis">Preis (€)</label>
        <input id="preis" type="number" step="0.01" min="0" placeholder="0.00">
      </div>
      <button id="speichern" class="btn-hinzufuegen" style="margin-top: 5px;">Hinzufügen</button>
    </div>
  </div>

  <!-- OVERLAY: Unterartikel -->
  <div id="overlay-sub" class="overlay-bg">
    <div class="overlay-box">
      <div class="overlay-header">
        Unterartikel hinzufügen
        <button class="close-btn" onclick="closeOverlays()">✕</button>
      </div>
      <div style="display: flex; gap: 10px;">
        <div class="input-group" style="width: 80px;">
          <label for="sub-stk">Stk</label>
          <input id="sub-stk" type="number" min="1" value="1">
        </div>
        <div class="input-group" style="flex-grow: 1;">
          <label for="sub-art">Artikelname</label>
          <input id="sub-art" type="text" list="katalog-liste" placeholder="Tippen oder wählen...">
        </div>
      </div>
      <div class="input-group">
        <label for="sub-preis">Preisaufschlag (€)</label>
        <input id="sub-preis" type="number" step="0.01" min="0" placeholder="0.00">
      </div>
      <div class="input-group">
        <label>Bestellstatus</label>
        <div class="radio-group" style="background: var(--bg-subtle); padding: 6px 10px; border-radius: 4px;">
          <label class="radio-label"><input type="radio" name="new-radio-sub" value="bestellen"> Zu bestellen</label>
          <label class="radio-label"><input type="radio" name="new-radio-sub" value="zulauf"> Im Zulauf</label>
          <label class="radio-label"><input type="radio" name="new-radio-sub" value="vorhanden" checked> Vorhanden</label>
        </div>
      </div>
      <button class="btn-hinzufuegen" onclick="addSub()" style="margin-top: 5px;">Unterartikel speichern</button>
    </div>
  </div>

  <script src="./table.js"></script>
</body>
</html>
