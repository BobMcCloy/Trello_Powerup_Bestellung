<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Produkte</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>

  <link rel="stylesheet" href="./hell.css?v=4">
  <link rel="stylesheet" href="./dunkel.css?v=4">

</head>
<body class="karte">

  <div class="top-bar">
    <button class="btn-hinzufuegen" onclick="openHauptOverlay()">+ Artikel hinzufügen [ + ]</button>
  </div>

  <div id="inhalt"></div>
  <datalist id="katalog-liste"></datalist>

  <!-- OVERLAY: Hauptartikel -->
  <div id="overlay-haupt" class="overlay-bg">
    <div class="overlay-box">
      <div class="overlay-header">
        Neuer Hauptartikel
        <button class="close-btn" onclick="closeOverlays()">✕</button>
      </div>
      <div class="form-row">
        <div class="input-group col-stk">
          <label for="stk">Stk</label>
          <input id="stk" type="number" min="1" value="1" onfocus="this.select()">
        </div>
        <div class="input-group col-flex">
          <label for="artikel">Artikelname</label>
          <input id="artikel" type="text" list="katalog-liste" placeholder="z. B. Rosen rot" onfocus="this.select()">
        </div>
      </div>
      <div class="form-row">
        <div class="input-group col-flex">
          <label for="preis">Preis (€)</label>
          <input id="preis" type="number" step="0.01" min="0" placeholder="0.00" onfocus="this.select()">
        </div>
        <div class="input-group col-flex">
          <label for="lieferant">Lieferant</label>
          <select id="lieferant" class="form-select">
            <option value="">- Kein Lieferant -</option>
          </select>
        </div>
      </div>
      <button id="speichern" class="btn-hinzufuegen mt-5">Hinzufügen</button>
    </div>
  </div>

  <!-- OVERLAY: Unterartikel -->
  <div id="overlay-sub" class="overlay-bg">
    <div class="overlay-box">
      <div class="overlay-header">
        Unterartikel hinzufügen
        <button class="close-btn" onclick="closeOverlays()">✕</button>
      </div>
      <div class="form-row">
        <div class="input-group col-stk">
          <label for="sub-stk">Stk</label>
          <input id="sub-stk" type="number" min="1" value="1" onfocus="this.select()">
        </div>
        <div class="input-group col-flex">
          <label for="sub-art">Artikelname</label>
          <input id="sub-art" type="text" list="katalog-liste" placeholder="Tippen oder wählen..." onfocus="this.select()">
        </div>
      </div>
      <div class="form-row">
        <div class="input-group col-flex">
          <label for="sub-preis">Preisaufschlag (€)</label>
          <input id="sub-preis" type="number" step="0.01" min="0" placeholder="0.00" onfocus="this.select()">
        </div>
        <div class="input-group col-flex">
          <label for="sub-lieferant">Lieferant</label>
          <select id="sub-lieferant" class="form-select" onchange="document.getElementById('sub-status').value = this.value ? 'bestellen' : 'vorhanden';">
            <option value="">- Kein Lieferant -</option>
          </select>
        </div>
      </div>
      <div class="input-group">
        <label>Bestellstatus</label>
        <select id="sub-status" class="form-select">
          <option value="bestellen">Zu bestellen</option>
          <option value="zulauf">Im Zulauf</option>
          <option value="vorhanden" selected>Vorhanden</option>
        </select>
      </div>
      <button id="btn-sub-speichern" class="btn-hinzufuegen mt-5" onclick="addSub()">Unterartikel hinzufügen</button>
    </div>
  </div>

  <script src="./config.js"></script>
  <script src="./utils.js"></script>
  <script src="./table.js"></script>
</body>
</html>
